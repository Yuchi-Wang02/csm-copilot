name: Verify workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests-js/practice.test.cjs tests-js/practice-session.test.cjs tests-js/review-links.test.cjs tests-js/case-review.test.cjs tests-js/triage-review.test.cjs tests-js/model-turns.test.cjs tests-js/copy-feedback.test.cjs
      - run: python -m pip install -e ".[dev,brief]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/mcp_smoke.py --output evidence/mcp-transcript.json
        timeout-minutes: 3
      - run: python scripts/build_demo.py
      - run: python -m pytest tests/test_review_brief.py -k generated_morning_briefs -q
      - run: python evaluation/triage_boundaries.py
      - run: python evaluation/negation.py
      - run: python scripts/build_model_replay.py
      - run: python scripts/build_project_brief.py
      - run: python scripts/build_client_education.py
      - run: git diff --exit-code -- demo/project-brief.pdf demo/publisher-teaching-example.pdf demo/data.js demo/model-runs.js demo/morning-review-en.md demo/morning-review-zh.md demo/case-briefs demo/product-feedback.md evidence
      - run: python -m build
      - run: python scripts/verify_wheel.py
        timeout-minutes: 7
      - run: python scripts/build_interview_demo.py --output dist/interview-demo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: interview-demo-${{ matrix.os }}-${{ github.run_attempt }}
          path: dist/interview-demo.zip
          if-no-files-found: error
